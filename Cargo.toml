[package]
name = "yoctoprint"
version = "0.1.0"
edition = "2021"

[dependencies]
serialport = "4.10.1"
regex = "1.13.1"
crossbeam = "0.8.5"
dirs = "7.0.0"
rand = "0.10.3"
enumset = "1.1.15"
serde = { version = "1.0.229", features = ["derive"] }
rocket_cors = { git = "https://github.com/lawliet89/rocket_cors", branch = "master" }
log = "0.4.35"
simple_logger = "5.2.0"
assert_approx_eq = "1.1.0"
clap = {version= "4.6.7", features=["derive"]}
ws = "0.9.2"
ctrlc = "3.5.2"
rocket_ws = "0.1.1"
noop-waker = "0.1.0"

[dependencies.rocket]
version = "0.5.2"
features = ["json"]

[profile.release]
lto = true